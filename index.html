.wrap{max-width:1100px;margin:0 auto;padding:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--bg)}tr:hover td{background:#151d24}td.num{text-align:right;font-variant-numeric:tabular-nums}

.tl{margin-top:8px;border-left:2px solid var(--line);padding-left:10px}.tl .ev{margin:0 0 10px}.tl .meta{font-size:11px;color:var(--mut)}.tl .txt{font-size:13px;white-space:pre-wrap}
textarea{width:100%;min-height:60px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 9px;font:inherit;font-size:13px;resize:vertical}
.btn{background:#24506a;border:1px solid #3c7898;color:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}.btn:disabled{opacity:.5}
.threat{display:flex;align-items:center;gap:8px;margin-top:6px}.threat .tb{flex:1;height:8px;background:#26313a;border-radius:4px;overflow:hidden}.threat .tb i{display:block;height:100%;background:linear-gradient(90deg,#f0c040,#ff5252)}
#v-rel.on{display:grid;grid-template-columns:1fr 360px;overflow:hidden}#relwrap{overflow:auto;padding:10px;display:flex;flex-direction:column;align-items:center}#relSide{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px 14px}
#spider{width:100%;min-width:min(860px,100%);max-width:900px;height:auto}#spider text{font-family:system-ui;pointer-events:none}#spider .node{cursor:pointer}
@media(max-width:860px){#v-rel.on{grid-template-columns:1fr}#relSide{border-left:0;border-top:1px solid var(--line)}}
.ssel{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:13px;flex:1;min-width:90px}.rsel.big button{padding:6px 11px;font-size:13px}
.warn{border-left:3px solid var(--nap);padding:6px 10px;background:#1d1a12;border-radius:4px;font-size:13px}

UA]</b>, <b>[Det]</b>, <b>[lsq]</b>, <b>[SKY]</b>, <b>[Arc]</b> ~30 each</li></ul>", "ins4_h": "Where the NAP alliances sit", "ins4_b": "<ul><li><b>Bottom side of the map:</b> [Kgb], [ZZZ], [Aur], [TRK]</li><li><b>Left side:</b> [POL], [RED]</li><li><b>Top-right side:</b> [xlx] (XIX), [PoH]</li><li><b>Countryside prisons (all 12)</b></li><li>Our corner of the map has <b>no NAP members</b> – every neighbour is outside the NAP.</li></ul>", "ins5_h": "Empty / inactive zones", "ins5_b": "<ul><li>The lower-right edge of the map (Y 0–100, where we are) and the far corners are full of untagged \"Chief####\" PDs, lv 3–9 – inactive or farm accounts.</li><li>The brown/grey belts right outside the Suburb are prison zones: no PDs, only criminals.</li><li>These quiet zones are the safest places to relocate weaker members or gather.</li></ul>", "ins6_h": "Landmarks near us", "ins6_b": "<ul><li>Our HQ 883/155 with Vault Trap 1 & 2.</li><li>We hold the Lv1 Crime Lab at ~956/237 (next to MVD).</li><li>We hold Prison No.6 at 846/237.</li><li>[ARC] Vault Trap 2 at ~985/262 and [TTn] Vault Trap 1 at ~800/185.</li></ul>", "ab1_h": "How this was made", "ab1_b": "<ul><li>108 survey screenshots, one per 100×100 tile block of the Countryside.</li><li>38 extra screenshots without gaps around our HQ, for the neighbours.</li><li>For every screenshot I counted the PDs, their levels and the alliance tags.</li></ul>", "ab2_h": "Heatmap", "ab2_b": "<ul><li><b>PD density</b>: how many PDs stand per 100 tiles. Red = crowded, dark = empty.</li><li><b>Avg PD level</b>: average level of the PDs in that area. Red = strong (lv 15+), blue = weak (lv 3–5).</li><li>Colours are blended between screenshots, so treat them as an estimate. Areas far from any screenshot fade out.</li></ul>", "ab3_h": "Limits", "ab3_b": "<ul><li>Outside our area: one screen per block, so smaller groups can be missed.</li><li>Suburb and Downtown are fogged and not mapped.</li><li>R5 / R4 positions of other alliances are not known y /{y}: {n} PD", "us": "мы", "nap": "NAP", "notnap": "не NAP", "nomatch": "Нет совпадений", "dip_area": "Наш район", "dip_all": "Весь штат", "dip_help": "Альянсы расположены там, где они стоят на карте. Линии соединяют соседей и любые пары с известными отношениями. Нажмите на линию, чтобы задать отношения между этими двумя альянсами; нажмите на круг для альянса. Число в круге = PD замечено.", "dip_our": "Наши отношения", "dip_start": "Начально: члены NAP дружественны друг другу, остальные – неизвестно. Каждое изменение записывается в обновления обоих альянсов.", "dip_allnap": "Показать все связи NAP (66 линий)", "dip_hint": "Нажмите на линию или круг.", "dip_napm": "Член NAP", "dip_other": "Другой альянс", "dip_thr": "⚠ = оценка угрозы", "area_banner": "Плотный скан (без пропусков) ~260×250 клеток вокруг нашего штаба 883/155. Расстояния – по прямой от штаба.", "area_tap": "Нажмите, чтобы показать на карте →", "th_fac": "Альянс", "th_rel": "Отношения", "th_nap": "NAP", "th_thr": "Угроза", "th_loc": "Место", "th_dist": "Клеток от KVK", "th_pds": "PD замечено", "th_avg": "Ср. ур.", "th_range": "Уровни", "th_latest": "Последнее обновление / что видно", "ph_filter": "Фильтр альянсов…", "sh_ring": "Наш район (38)", "sh_all": "Вся сельская зона (108)", "data_note": "Заметки скана (имена, здания) остаются на английском.", "ins_thr_h": "Рейтинг угроз (полностью просканированные соседи)", "ins_thr_row": "{n} PD, ср. ур. {a}, {d} клеток", "ins_thr_n": "Остальные не включены: просканированы не полностью.", "ins1_h": "Ближайшие соседи под наблюдением", "ins1_b": "<p>Ни один альянс NAP не граничит с нами. Ближайшее присутствие NAP – [TCE] с Тюрьмой №7 (~208 клеток, в сторону Пригорода).</p><ul><li><b>[MVD]</b> – между нами и Пригородом; их флаги <b>касаются нашей границы</b> у ~945/235. Не NAP. Видны низкие уровни (8–11).</li><li><b>[Art]</b> – вплотную к нам (~38 клеток), ~40 PD, до ур. 16.</li><li><b>[SKY] / [Arc] / [SPi]</b> – один большой блок справа от нас на карте, вместе ~85 PD.</li><li><b>[TTn]</b> (Ловушка-сейф 1) и <b>[A0I]</b> (штаб, ур. 18) слева от нас.</li></ul>", "ins2_h": "Сильнейшие альянсы (по уровню PD)", "ins2_b": "<ul><li><b>[Kgb]</b> (NAP) ур. 16–19. Около 450–550 / 250.</li><li><b>[ZZZ]</b> (NAP) сред. ур. 15.5, ~25 PD. Около 550 / 150.</li><li><b>[AYE]</b> сред. ур. 14. Около 250 / 750.</li><li><b>[ABC]</b> сред. ур. 13.5, ~27 PD. Около 350 / 150.</li><li><b>[TB4]</b> ~35 PD, ур. 7–17. Около 750 / 250 – слева от нас.</li><li><b>[lsq]</b>, <b>[KNP]</b>, <b>[ToF]</b> тоже в среднем ур. 13.</li></ul>", "ins3_h": "Крупнейшие скопления (больше всего PD)", "ins3_b": "<ul><li><b>[sur]</b> ~45 PD у 950 / 1050</li><li><b>[Art]</b> ~40 у 845 / 150 (наш сосед)</li><li><b>[TB4]</b> ~35 у 750 / 250</li><li><b>[DUA]</b>, <b>[Det]</b>, <b>[lsq]</b>, <b>[SKY]</b>, <b>[Arc]</b> ~30 у каждого</li></ul>", "ins4_h": "Где стоят альянсы NAP", "ins4_b": "<ul><li><b>Нижняя сторона карты:</b> [Kgb], [ZZZ], [Aur], [TRK]</li><li><b>Левая сторона:</b> [POL], [RED]</li><li><b>Верхняя правая сторона:</b> [xlx] (XIX), [PoH]</li><li><b>Тюрьмы сельской зоны (все 12)</b></li><li>В нашем углу карты <b>нет членов NAP</b> – все соседи вне NAP.</li></ul>", "ins5_h": "Пустые / неактивные зоны", "ins5_b": "<ul><li>Нижний правый край карты (Y 0–100, где мы) и дальние углы заполнены PD без тега \"Chief####\", ур. 3–9 – неактивные или фермы.</li><li>Коричневые/серые полосы сразу за Пригородом – зоны тюрем: нет PD, только преступники.</li><li>Эти тихие зоны – самые безопасные места для переселения слабых игроков или сбора.</li></ul>", "ins6_h": "Объекты рядом с нами", "ins6_b": "<ul><li>Наш штаб 883/155 с Ловушками-сейфами 1 и 2.</li><li>Нам принадлежит Крим. лаборатория ур.1 у ~956/237 (рядом с MVD).</li><li>Нам принадлежит Тюрьма №6 у 846/237.</li><li>Ловушка-сейф 2 [ARC] у ~985/262 и Ловушка-сейф 1 [TTn] у ~800/185.</li></ul>", "ab1_h": "Как это сделано", "ab1_b": "<ul><li>108 обзорных скриншотов, по одному на блок 100×100 клеток.</li><li>38 дополнительных скриншотов без пропусков вокруг нашего штаба.</li><li>На каждом скрине посчитаны PD, их уровни и теги альянсов.</li></ul>", "ab2_h": "Тепловая карта", "ab2_b": "<ul><li><b>Плотность PD</b>: сколько PD на 100 клеток. Красный = тесно, тёмный = пусто.</li><li><b>Средний ур. PD</b>: средний уровень PD в районе. Красный = сильные (ур. 15+), синий = слабые (ур. 3–5).</li><li>Цвета сглажены между скринами – это оценка. Места вдали от скринов бледнеют.</li></ul>", "ab3_h": "Ограничения", "ab3_b": "<ul><li>Вне нашего района: один скрин на блок, мелкие группы могут быть пропущены.</li><li>Пригород и Центр в тумане и не нанесены.</li><li>Позиции R5 / R4 других альянсов пока неизвестны.</li><li>Без списков игроков: имена читались лишь частично, поэтому их нет, пока район не покрыт полностью.</li><li>PD перемещаются. Это снимок на 18 ноя.</li><li>[xlx] – вероятно XIX (NAP). [Arc] и [ARC] – вероятно один альянс.</li></ul>", "ab4_h": "Оценка угрозы", "ab4_b": "<ul><li>Только для альянсов в полностью просканированном районе: MVD, Art, SKY, Arc, A0I, TTn, OPG, AME.</li><li>Оценка = PD × средний уровень ÷ расстояние до нашего штаба (ближе – выше), максимум = 100.</li><li>Измеряет размер, силу и близость – не намерения. Для намерений используйте отношения и обновления.</li></ul>", "ab5_h": "Отношения и обновления", "ab5_b": "<ul><li>Зелёный – дружественный · Оранжевый – недружественный · Красный – враг · Серый – нейтральный · Серый пунктир – неизвестно.</li><li>Отношения задаются между любыми двумя альянсами, не только с нами. Они видны линиями на карте и во вкладке Дипломатия.</li><li>Изменения и обновления сохраняются для всех, кто может редактировать страницу (поделитесь с R4 как Contributor или Editor).</li><li>Каждое обновление помечено временем сервера и автором.</li></ul>", "ab6_h": "Альянсы NAP", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ.</p>", "lang": "Язык", "cb_res": "Занятые ресурсы альянсов", "th_res": "Ресурсы", "ins7_h": "Тюрьмы сельской зоны (все 12)", "ins7_n": "Все 12 у членов NAP. Прочитано в 11:05 по серверу, 18 ноя; у всех защита ~1д 12ч.", "ins8_h": "Занятые ресурсы альянсов", "ins8_n": "Видны на скриншотах. Точно в нашем районе (±3 клетки), в остальных местах примерно (±15). Крупный значок = NAP.", "res_cash": "Денежный склад", "res_ammo": "Склад боеприпасов", "res_elec": "Электроподстанция", "res_gas": "Заправка", "set_h": "Задать отношения", "set_hint": "Выберите два альянса и нажмите статус. Изменения сохраняются для всех с правом редактирования.", "set_a": "Альянс", "set_with": "с", "set_kvk": "✎ Отношения с KVK", "heat_t": "Угроза", "lg_t1": "низкая", "lg_t2": "высокая угроза", "heat_t_note": "Тепловая карта угрозы: только полностью просканированный район. Сила × близость, выше для врагов/недружественных, ноль для дружественных.", "tab_hist": "История", "hist_all": "Все", "hist_rel": "Отношения", "hist_upd": "Обновления", "hist_empty": "Пока ничего нет. Задайте отношения или добавьте обновление – они появятся здесь.", "hist_any": "Все альянсы", "exp_dip": "🖼 Экспорт схемы дипломатии", "exp_map": "🖼 Экспорт карты", "exp_txt": "📋 Копировать для Discord", "exp_ok": "Сохранено – выложите в Discord.", "exp_fail": "Экспорт здесь недоступен.", "copied": "Скопировано – вставьте в Discord.", "exp_h": "Поделиться", "txt_title": "Дипломатия KVK – штат #205", "pub_banner": "Копия только для чтения, обновлено {d}. Изменения – через R4 KVK."}, "ja": {"r4_btn": "🔒 R4レポート", "title": "州 #205 – 郊外マップ", "sub": "2026年11月18日 09:40–10:23(サーバー時間)にスキャン · ゲームと同じ向き(上 = +X+Y)", "st_screens": "スクリーン", "st_pds": "PD 集計", "st_all": "同盟を発見", "st_nap": "NAP 同盟", "tab_map": "マップ", "tab_dip": "外交", "tab_ins": "主な発見", "tab_area": "自エリア", "tab_fac": "全同盟", "tab_shots": "スクリーンショット", "tab_about": "見方", "b_kvk": "⌖ KVKへ", "b_all": "⤢ 州全体", "legend": "凡例", "h_heat": "ヒートマップ", "heat_d": "PD密度", "heat_l": "平均PDレベル", "off": "オフ", "h_col": "同盟の色分け", "col_rel": "関係", "col_nap": "NAPかどうか", "h_show": "マッ 円の数字 = 確認PD数。", "dip_our": "我々の関係", "dip_start": "初期設定: NAPメンバー同士は友好、それ以外は不明。変更はすべて両同盟の更新に記録されます。", "dip_allnap": "NAPのつながりをすべて表示(66本)", "dip_hint": "線または円をタップ。", "dip_napm": "NAPメンバー", "dip_other": "その他の同盟", "dip_thr": "⚠ = 脅威度", "area_banner": "本部(883/155)周辺 約260×250マスを隙間なくスキャン。距離は本部からの直線マス数。", "area_tap": "タップでマップに表示 →", "th_fac": "同盟", "th_rel": "関係", "th_nap": "NAP", "th_thr": "脅威", "th_loc": "位置", "th_dist": "KVKからのマス", "th_pds": "確認PD", "th_avg": "平均Lv", "th_range": "レベル範囲", "th_latest": "最新の更新 / 確認内容", "ph_filter": "同盟を絞り込み…", "sh_ring": "自エリア (38)", "sh_all": "郊外全体 (108)", "data_note": "スキャンのメモ(名前・建物)は英語のままです。", "ins_thr_h": "脅威ランキング(完全スキャンした隣接同盟)", "ins_thr_row": "{n} PD、平均Lv {a}、{d} マス", "ins_thr_n": "その他は除外: 完全スキャンではないため全体像がありません。", "ins1_h": "要注意の隣接同盟", "ins1_b": "<p>我々に接するNAP同盟はありません。最も近いNAPは第7刑務所を持つ[TCE](約208マス、市街地方向)。</p><ul><li><b>[MVD]</b> – 我々と市街地の間。旗が約945/235で<b>我々の境界に接触</b>。NAP外。確認レベルは低め(8–11)。</li><li><b>[Art]</b> – すぐ隣(約38マス)、約40 PD、最大Lv16。</li><li><b>[SKY] / [Arc] / [SPi]</b> – マップ上で我々の右側の大きな塊、合計約85 PD。</li><li><b>[TTn]</b>(金庫トラップ1)と<b>[A0I]</b>(本部、Lv18)が左側。</li></ul>", "ins2_h": "最強の同盟(PDレベル順)", "ins2_b": "<ul><li><b>[Kgb]</b>(NAP)Lv16–19。450–550 / 250付近。</li><li><b>[ZZZ]</b>(NAP)平均Lv15.5、約25 PD。550 / 150付近。</li><li><b>[AYE]</b> 平均Lv14。250 / 750付近。</li><li><b>[ABC]</b> 平均Lv13.5、約27 PD。350 / 150付近。</li><li><b>[TB4]</b> 約35 PD、Lv7–17。750 / 250付近 – 我々のすぐ左。</li><li><b>[lsq]</b>、<b>[KNP]</b>、<b>[ToF]</b> も平均Lv13。</li></ul>", "ins3_h": "最大の集団(PD数)", "ins3_b": "<ul><li><b>[sur]</b> 約45 PD(950 / 1050)</li><li><b>[Art]</b> 約40(845 / 150、隣接)</li><li><b>[TB4]</b> 約35(750 / 250)</li><li><b>[DUA]</b>、<b>[Det]</b>、<b>[lsq]</b>、<b>[SKY]</b>、<b>[Arc]</b> 各約30</li></ul>", "ins4_h": "NAP同盟の位置", "ins4_b": "<ul><li><b>マップ下側:</b> [Kgb]、[ZZZ]、[Aur]、[TRK]</li><li><b>左側:</b> [POL]、[RED]</li><li><b>右上側:</b> [xlx](XIX)、[PoH]</li><li><b>郊外の刑務所(全12)</b></li><li>我々のいる角には<b>NAPメンバーがいません</b> – 隣接同盟はすべてNAP外。</li></ul>", "ins5_h": "空き / 非アクティブ地帯", "ins5_b": "<ul><li>マップ右下の端(Y 0–100、我々の位置)と遠い角はタグなしの「Chief####」PD(Lv3–9)だらけ – 非アクティブまたはファーム。</li><li>市街地のすぐ外の茶色/灰色の帯は刑務所エリア: PDはなく犯罪者のみ。</li><li>こうした静かな地帯は弱いメンバーの移転や集合に最も安全です。</li></ul>", "ins6_h": "近くの施設", "ins6_b": "<ul><li>本部 883/155(金庫トラップ1・2)。</li><li>Lv1犯罪ラボ(約956/237、MVDの隣)を保持中。</li><li>第6刑務所(846/237)を我々が保持。</li><li>[ARC] 金庫トラップ2(約985/262)と [TTn] 金庫トラップ1(約800/185)。</li></ul>", "ab1_h": "作成方法", "ab1_b": "<ul><li>郊外の100×100マスごとに1枚、計108枚の調査スクリーンショット。</li><li>本部周辺を隙間なく撮った追加38枚。</li><li>各スクリーンショットでPD数・レベル・同盟タグを集計。</li></ul>", "ab2_h": "ヒートマップ", "ab2_b": "<ul><li><b>PD密度</b>: 100マスあたりのPD数。赤 = 混雑、暗い = 空。</li><li><b>平均PDレベル</b>: そのエリアのPD平均レベル。赤 = 強い(Lv15+)、青 = 弱い(Lv3–5)。</li><li>色はスクリーンショット間で補間した推定値。データから遠い場所は薄くなります。</li></ul>", "ab3_h": "制限", "ab3_b": "<ul><li>自エリア外は1ブロック1枚のため、小さな集団は見落とす可能性があります。</li><li>市街地と中心部は霧のため未調査。</li><li>他同盟のR5 / R4の位置はまだ不明。</li><li>プレイヤー一覧なし: 名前が一部しか読めないため、エリアを完全にカバーするまで除外。</li><li>PDは移動します。11月18日時点のスナップショットです。</li><li>[xlx]はおそらくXIX(NAP)。[Arc]と[ARC]はおそらく同じ同盟。</li></ul>", "ab4_h": "脅威度", "ab4_b": "<ul><li>完全スキャンしたエリアの同盟のみ: MVD、Art、SKY、Arc、A0I、TTn、OPG、AME。</li><li>脅威度 = 確認PD数 × 平均レベル ÷ 本部からの距離(近いほど高い)、最高 = 100。</li><li>規模・強さ・距離を測るもので、意図ではありません。意図は関係と更新で判断。</li></ul>", "ab5_h": "関係と更新", "ab5_b": "<ul><li>緑 友好 · オレンジ 非友好 · 赤 敵 · 灰 中立 · 灰の点線 不明。</li><li>関係は我々とだけでなく任意の2同盟間で設定でき、マップ上の線と外交タブに表示されます。</li><li>変更と更新は、このページを編集できる全員に保存されます(R4にContributorまたはEditorとして共有)。</li><li>各更新にはサーバー時間と記入者が記録されます。</li></ul>", "ab6_h": "NAP同盟", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ。</p>", "lang": "言語", "cb_res": "占領済みの同盟資源", "th_res": "資源", "ins7_h": "郊外の刑務所(全12)", "ins7_n": "12か所すべてNAPメンバーが保持。11月18日11:05(サーバー)時点、全て約1日12時間の保護中。", "ins8_h": "占領済みの同盟資源", "ins8_n": "スクリーンショットから確認。自エリアは正確(±3マス)、それ以外は概算(±15)。大きいアイコン = NAPの占領。", "res_cash": "現金倉庫", "res_ammo": "弾薬庫", "res_elec": "電力ポスト", "res_gas": "ガソリンスタンド", "set_h": "関係を設定", "set_hint": "2つの同盟を選んで状態をタップ。変更は編集権限のある全員に保存されます。", "set_a": "同盟", "set_with": "と", "set_kvk": "✎ KVKとの関係を設定 ", "fog1": "Suburbio + Centro", "fog2": "con niebla – sin mapear", "gapless": "escaneado sin huecos", "r_friendly": "Amistosa", "r_unfriendly": "Hostil", "r_enemy": "Enemiga", "r_neutral": "Neutral", "r_unknown": "Desconocida", "pds_seen": "PD vistos", "level": "nivel", "avg": "media", "tiles_from": "casillas desde KVK", "around": "cerca de", "fully": "escaneada por completo", "partly": "vista en parte", "rel_us": "Su relación con nosotros:", "rel_others": "Sus relaciones con otras", "tiles": "casillas", "threat": "Amenaza", "thr_na_full": "Amenaza: no calculada – no hay datos de nivel de esta alianza.", "thr_na_part": "Amenaza: no calculada – no escaneada por completo, la imagen está incompleta.", "thr_calc": "{n} PD × nv medio {a} a {d} casillas", "art_note": "El recuento incluye algunos PD sin etiqueta entre los miembros de Art, así que puede ser algo alto.", "shots": "Capturas:", "updates": "Actualizaciones", "add_ph": "Añade una actualización sobre [{t}]… (quién lidera, actividad, ataques, acuerdos)", "add_btn": "Añadir", "saved_db": "Guardado para todos con permiso de edición", "saved_local": "Guardado solo en este navegador", "read_only": "Puedes leer las actualizaciones pero no añadirlas.", "no_upd": "Aún no hay actualizaciones.", "by_claude": "Claude (escaneo del mapa)", "someone": "Alguien", "save_err": "No se pudo guardar – puede que solo tengas acceso de lectura.", "quota": "Almacenamiento lleno – borra actualizaciones antiguas primero.", "rel_change": "Relación [{a}] ↔ [{b}]: {o} → {n}", "pair_apart": "a {d} casillas", "both_nap": "ambas NAP", "open_all": "Abrir alianza:", "area_title": "Zona cerca de {x} / {y}", "area_ring": "Nuestra zona – escaneada sin huecos", "area_survey": "Captura de muestreo de este bloque 100×100", "pds_on": "PD en pantalla", "avg_level": "nivel medio", "no_tags": "Sin etiquetas – PD inactivos o sin alianza", "pds_lbl": "PD:", "bld": "Edificios:", "held_by": "En manos de", "owner_unread": "Dueño sin leer", "dens_unit": "PD / 100 casillas", "shot_tip": "Captura {x}/{y}: {n} PD", "us": "nosotros", "nap": "NAP", "notnap": "no NAP", "nomatch": "Sin resultados", "dip_area": "Nuestra zona", "dip_all": "Todo el estado", "dip_help": "Las alianzas están donde se encuentran en el mapa. Las líneas unen vecinas y cualquier pareja con relación conocida. Toca una línea para fijar la relación entre esas dos alianzas; toca un círculo para ver la alianza. Número en el círculo = PD vistos.", "dip_our": "Nuestras relaciones", "dip_start": "Punto de partida: los miembros NAP son amistosos entre sí, el resto es desconocido. Cada cambio queda registrado en las actualizaciones de ambas alianzas.", "dip_allnap": "Mostrar todos los vínculos NAP (66 líneas)", "dip_hint": "Toca una línea o un círculo.", "dip_napm": "Miembro NAP", "dip_other": "Otra alianza", "dip_thr": "⚠ = puntuación de amenaza", "area_banner": "Escaneo denso (sin huecos) de unas 260×250 casillas alrededor de nuestro cuartel en 883/155. Distancias en línea recta desde el cuartel.", "area_tap": "Toca para verlo en el mapa →", "th_fac": "Alianza", "th_rel": "Relación", "th_nap": "NAP", "th_thr": "Amenaza", "th_loc": "Ubicación", "th_dist": "Casillas desde KVK", "th_pds": "PD vistos", "th_avg": "Nv medio", "th_range": "Rango de nivel", "th_latest": "Última actualización / lo que vi", "ph_filter": "Filtrar alianzas…", "sh_ring": "Nuestra zona (38)", "sh_all": "Toda la zona rural (108)", "data_note": "Las notas del escaneo (nombres, edificios) quedan en inglés.", "ins_thr_h": "Ranking de amenaza (vecinos escaneados por completo)", "ins_thr_row": "{n} PD, nv medio {a}, {d} casillas", "ins_thr_n": "Las demás quedan fuera: no escaneadas por completo.", "ins1_h": "Vecinos directos a vigilar", "ins1_b": "<p>Ninguna alianza NAP limita con nosotros. La presencia NAP más cercana es [TCE] con la Prisión n.º 7 (~208 casillas, hacia el Suburbio).</p><ul><li><b>[MVD]</b> – entre nosotros y el Suburbio; sus banderas <b>tocan nuestra frontera</b> en ~945/235. No NAP. Niveles bajos vistos (8–11).</li><li><b>[Art]</b> – pegada a nosotros (~38 casillas), ~40 PD, hasta nv 16.</li><li><b>[SKY] / [Arc] / [SPi]</b> – un gran bloque a nuestra derecha en el mapa, ~85 PD en total.</li><li><b>[TTn]</b> (Trampa de bóveda 1) y <b>[A0I]</b> (cuartel, nv 18) a nuestra izquierda.</li></ul>", "ins2_h": "Alianzas más fuertes (por nivel de PD)", "ins2_b": "<ul><li><b>[Kgb]</b> (NAP) nv 16–19. Cerca de 450–550 / 250.</li><li><b>[ZZZ]</b> (NAP) nv medio 15,5, ~25 PD. Cerca de 550 / 150.</li><li><b>[AYE]</b> nv medio 14. Cerca de 250 / 750.</li><li><b>[ABC]</b> nv medio 13,5, ~27 PD. Cerca de 350 / 150.</li><li><b>[TB4]</b> ~35 PD, nv 7–17. Cerca de 750 / 250 – justo a nuestra izquierda.</li><li><b>[lsq]</b>, <b>[KNP]</b>, <b>[ToF]</b> también con nv medio 13.</li></ul>", "ins3_h": "Mayores grupos (más PD)", "ins3_b": "<ul><li><b>[sur]</b> ~45 PD en 950 / 1050</li><li><b>[Art]</b> ~40 en 845 / 150 (nuestra vecina)</li><li><b>[TB4]</b> ~35 en 750 / 250</li><li><b>[DUA]</b>, <b>[Det]</b>, <b>[lsq]</b>, <b>[SKY]</b>, <b>[Arc]</b> ~30 cada una</li></ul>", "ins4_h": "Dónde están las alianzas NAP", "ins4_b": "<ul><li><b>Lado inferior del mapa:</b> [Kgb], [ZZZ], [Aur], [TRK]</li><li><b>Lado izquierdo:</b> [POL], [RED]</li><li><b>Lado superior derecho:</b> [xlx] (XIX), [PoH]</li><li><b>Prisiones de la zona rural (las 12)</b></li><li>Nuestra esquina del mapa <b>no tiene miembros NAP</b> – todos los vecinos están fuera del NAP.</li></ul>", "ins5_h": "Zonas vacías / inactivas", "ins5_b": "<ul><li>El borde inferior derecho del mapa (Y 0–100, donde estamos) y las esquinas lejanas están llenos de PD sin etiqueta \"Chief####\", nv 3–9 – cuentas inactivas o granjas.</li><li>Las franjas marrones/grises junto al Suburbio son zonas de prisión: sin PD, solo criminales.</li><li>Estas zonas tranquilas son los lugares más seguros para reubicar a miembros débiles o reunirse.</li></ul>", "ins6_h": "Puntos de interés cerca", "ins6_b": "<ul><li>Nuestro cuartel 883/155 con Trampas de bóveda 1 y 2.</li><li>Tenemos el Laboratorio criminal nv1 en ~956/237 (junto a MVD).</li><li>Tenemos la Prisión n.º 6 en 846/237.</li><li>Trampa de bóveda 2 de [ARC] en ~985/262 y Trampa de bóveda 1 de [TTn] en ~800/185.</li></ul>", "ab1_h": "Cómo se hizo", "ab1_b": "<ul><li>108 capturas de muestreo, una por bloque de 100×100 casillas.</li><li>38 capturas extra sin huecos alrededor de nuestro cuartel.</li><li>En cada captura conté los PD, sus niveles y las etiquetas de alianza.</li></ul>", "ab2_h": "Mapa de calor", "ab2_b": "<ul><li><b>Densidad de PD</b>: cuántos PD hay por 100 casillas. Rojo = lleno, oscuro = vacío.</li><li><b>Nivel medio de PD</b>: nivel medio de los PD de la zona. Rojo = fuertes (nv 15+), azul = débiles (nv 3–5).</li><li>Los colores se mezclan entre capturas: es una estimación. Las zonas lejos de cualquier captura se desvanecen.</li></ul>", "ab3_h": "Límites", "ab3_b": "<ul><li>Fuera de nuestra zona: una captura por bloque, así que grupos pequeños pueden faltar.</li><li>El Suburbio y el Centro tienen niebla y no están mapeados.</li><li>Aún no se conocen las posiciones de R5 / R4 de otras alianzas.</li><li>Sin listas de jugadores: los nombres solo se leían en parte, así que se omiten hasta cubrir la zona por completo.</li><li>Los PD se mueven. Es una foto del 18 nov.</li><li>[xlx] probablemente es XIX (NAP). [Arc] y [ARC] probablemente son la misma alianza.</li></ul>", "ab4_h": "Puntuación de amenaza", "ab4_b": "<ul><li>Solo para alianzas de nuestra zona escaneada por completo: MVD, Art, SKY, Arc, A0I, TTn, OPG, AME.</li><li>Puntuación = PD vistos × nivel medio ÷ distancia a nuestro cuartel (más cerca cuenta más), escalada para que la más alta = 100.</li><li>Mide tamaño, fuerza y cercanía, no intenciones. Para eso usa las relaciones y actualizaciones.</li></ul>", "ab5_h": "Relaciones y actualizaciones", "ab5_b": "<ul><li>Verde Amistosa · Naranja Hostil · Rojo Enemiga · Gris Neutral · Gris discontinuo Desconocida.</li><li>Las relaciones son entre dos alianzas cualesquiera, no solo con nosotros. Se ven como líneas en el mapa y en la pestaña Diplomacia.</li><li>Los cambios y actualizaciones se guardan para todos los que pueden editar esta página (compártela con tus R4 como Contributor o Editor).</li><li>Cada actualización lleva la hora del servidor y quién la escribió.</li></ul>", "ab6_h": "Alianzas NAP", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ.</p>", "lang": "Idioma", "cb_res": "Recursos de alianza ocupados", "th_res": "Recursos", "ins7_h": "Prisiones de la zona rural (las 12)", "ins7_n": "Las 12 están en manos de miembros NAP. Leídas a las 11:05 hora del servidor, 18 nov; todas protegidas ~1d 12h.", "ins8_h": "Recursos de alianza ocupados", "ins8_n": "Vistos en las capturas. Exactos en nuestra zona (±3 casillas), aproximados en el resto (±15). Icono grande = ocupado por NAP.", "res_cash": "Almacén de efectivo", "res_ammo": "Depósito de munición", "res_elec": "Poste eléctrico", "res_gas": "Gasolinera", "set_h": "Fijar una relación", "set_hint": "Elige dos alianzas y toca un estado. Los cambios se guardan para todos con permiso de edición.", "set_a": "Alianza", "set_with": "con", "set_kvk": "✎ Relación con KVK", "heat_t": "Amenaza", "lg_t1": "baja", "lg_t2": "amenaza alta", "heat_t_note": "Mapa de amenaza: solo nuestra zona escaneada por completo. Fuerza × cercanía, mayor para Enemiga/Hostil, cero para Amistosa.", "tab_hist": "Historial", "hist_all": "Todo", "hist_rel": "Relaciones", "hist_upd": "Actualizaciones", "hist_empty": "Aún no hay nada. Fija una relación o añade una actualización y aparecerá aquí.", "hist_any": "Todas las alianzas", "exp_dip": "🖼 Exportar imagen de diplomacia", "exp_map": "🖼 Exportar imagen del mapa", "exp_txt": "📋 Copiar para Discord", "exp_ok": "Guardado – publícalo en Discord.", "exp_fail": "Exportar no está disponible aquí.", "copied": "Copiado – pégalo en Discord.", "exp_h": "Compartir", "txt_title": "Diplomacia KVK – Estado #205", "pub_banner": "Copia de solo lectura, actualizada {d}. Pide cambios a los R4 de KVK."}, "fr": {"r4_btn": "🔒 Rapports R4", "title": "État #205 – Carte de la campagne", "sub": "Scanné le 18 nov. 2026, 09:40–10:23 heure serveur · carte orientée comme le jeu (haut = +X+Y)", "st_screens": "captures", "st_pds": "PD comptés", "st_all": "alliances trouvées", "st_nap": "alliances NAP", "tab_map": "Carte", "tab_dip": "Diplomatie", "tab_ins": "Points clés", "tab_area": "Notre zone", "tab_fac": "Toutes les alliances", "tab_shots": "Captures", "tab_about": "Mode d'emploi", "b_kvk": "⌖ Aller à KVK", "b_all": "⤢ Tout l'État", "legend": "Légende", "h_heat": "Carte de chaleur", "heat_d": "Densité de PD", "heat_l": "Niveau moyen des PD", "off": "Désactivé", "h_col": "Colorer les alliances par", "col_rel": "Relation", "col_nap": "NAP ou non", "h_show": "Afficher sur la carte", "cb_fac": "Alliances (cercles + tags)", "cb_links": "Lignes de relation entre alliances", "cb_places": "QG, prisons, coffres-pièges, labos", "cb_nap": "Alliances NAP seulement", "cb_pts": "Où j'ai pris les captures", "h_find": "Chercher une alliance", "ph_find": "ex. MVD", "h_sel": "Sélection", "sel_hint": "Touchez le cercle d'une alliance, un lieu ou n'importe quel point de la carte.", "lg_empty": "vide", "lg_dens": "8+ PD / 100 cases", "lg_lv": "niv 3", "lg_lv2": "niv 16+", "lg_us": "Nous", "lg_nap": "NAP", "lg_notnap": "Hors NAP", "lg_size": "Taille du cercle = PD vus · ★ QG · ⬢ prison · V coffre-piège · L labo · ■ ressource (grand = NAP)", "fog1": "Banlieue + Centre", "fog2": "dans le brouillard – non cartographié", "gapless": "scanné sans trous", "r_friendly": "Amicale", "r_unfriendly": "Inamicale", "r_enemy": "Ennemie", "r_neutral": "Neutre", "r_unknown": "Inconnue", "pds_seen": "PD vus", "level": "niveau", "avg": "moy.", "tiles_from": "cases de KVK", "around": "vers", "fully": "entièrement scannée", "partly": "vue en partie", "rel_us": "Leur relation avec nous :", "rel_others": "L  cercle = PD vus.", "dip_our": "Nos relations", "dip_start": "Départ : les membres du NAP sont amicaux entre eux, le reste est inconnu. Chaque changement est noté dans les mises à jour des deux alliances.", "dip_allnap": "Afficher tous les liens NAP (66 lignes)", "dip_hint": "Touchez une ligne ou un cercle.", "dip_napm": "Membre du NAP", "dip_other": "Autre alliance", "dip_thr": "⚠ = score de menace", "area_banner": "Scan dense (sans trous) d'environ 260×250 cases autour de notre QG en 883/155. Distances en ligne droite depuis le QG.", "area_tap": "Touchez pour voir sur la carte →", "th_fac": "Alliance", "th_rel": "Relation", "th_nap": "NAP", "th_thr": "Menace", "th_loc": "Position", "th_dist": "Cases de KVK", "th_pds": "PD vus", "th_avg": "Niv moy", "th_range": "Niveaux", "th_latest": "Dernière info / ce que j'ai vu", "ph_filter": "Filtrer les alliances…", "sh_ring": "Notre zone (38)", "sh_all": "Toute la campagne (108)", "data_note": "Les notes du scan (noms, bâtiments) restent en anglais.", "ins_thr_h": "Classement des menaces (voisins entièrement scannés)", "ins_thr_row": "{n} PD, niv moy {a}, {d} cases", "ins_thr_n": "Les autres sont exclues : pas entièrement scannées.", "ins1_h": "Voisins directs à surveiller", "ins1_b": "<p>Aucune alliance NAP ne nous borde. La présence NAP la plus proche est [TCE] avec la Prison n°7 (~208 cases, vers la Banlieue).</p><ul><li><b>[MVD]</b> – entre nous et la Banlieue ; leurs drapeaux <b>touchent notre frontière</b> vers ~945/235. Hors NAP. Niveaux bas vus (8–11).</li><li><b>[Art]</b> – collée à nous (~38 cases), ~40 PD, jusqu'au niv 16.</li><li><b>[SKY] / [Arc] / [SPi]</b> – un gros bloc à notre droite sur la carte, ~85 PD au total.</li><li><b>[TTn]</b> (Coffre-piège 1) et <b>[A0I]</b> (QG, niv 18) à notre gauche.</li></ul>", "ins2_h": "Alliances les plus fortes (niveau des PD)", "ins2_b": "<ul><li><b>[Kgb]</b> (NAP) niv 16–19. Vers 450–550 / 250.</li><li><b>[ZZZ]</b> (NAP) niv moy 15,5, ~25 PD. Vers 550 / 150.</li><li><b>[AYE]</b> niv moy 14. Vers 250 / 750.</li><li><b>[ABC]</b> niv moy 13,5, ~27 PD. Vers 350 / 150.</li><li><b>[TB4]</b> ~35 PD, niv 7–17. Vers 750 / 250 – juste à notre gauche.</li><li><b>[lsq]</b>, <b>[KNP]</b>, <b>[ToF]</b> aussi niv moy 13.</li></ul>", "ins3_h": "Plus gros groupes (le plus de PD)", "ins3_b": "<ul><li><b>[sur]</b> ~45 PD en 950 / 1050</li><li><b>[Art]</b> ~40 en 845 / 150 (notre voisine)</li><li><b>[TB4]</b> ~35 en 750 / 250</li><li><b>[DUA]</b>, <b>[Det]</b>, <b>[lsq]</b>, <b>[SKY]</b>, <b>[Arc]</b> ~30 chacune</li></ul>", "ins4_h": "Où se trouvent les alliances NAP", "ins4_b": "<ul><li><b>Bas de la carte :</b> [Kgb], [ZZZ], [Aur], [TRK]</li><li><b>Côté gauche :</b> [POL], [RED]</li><li><b>Haut droit :</b> [xlx] (XIX), [PoH]</li><li><b>Prisons de la campagne (les 12)</b></li><li>Notre coin de la carte n'a <b>aucun membre du NAP</b> – tous nos voisins sont hors NAP.</li></ul>", "ins5_h": "Zones vides / inactives", "ins5_b": "<ul><li>Le bord inférieur droit de la carte (Y 0–100, où nous sommes) et les coins éloignés sont pleins de PD sans tag \"Chief####\", niv 3–9 – comptes inactifs ou fermes.</li><li>Les bandes marron/grises juste hors de la Banlieue sont des zones de prison : pas de PD, seulement des criminels.</li><li>Ces zones calmes sont les plus sûres pour déplacer les membres faibles ou se rassembler.</li></ul>", "ins6_h": "Lieux proches", "ins6_b": "<ul><li>Notre QG 883/155 avec les Coffres-pièges 1 et 2.</li><li>Nous tenons le Labo criminel niv1 vers ~956/237 (à côté de MVD).</li><li>Nous tenons la Prison n°6 en 846/237.</li><li>Coffre-piège 2 de [ARC] vers ~985/262 et Coffre-piège 1 de [TTn] vers ~800/185.</li></ul>", "ab1_h": "Comment c'est fait", "ab1_b": "<ul><li>108 captures de sondage, une par bloc de 100×100 cases.</li><li>38 captures en plus, sans trous, autour de notre QG.</li><li>Sur chaque capture, j'ai compté les PD, leurs niveaux et les tags d'alliance.</li></ul>", "ab2_h": "Carte de chaleur", "ab2_b": "<ul><li><b>Densité de PD</b> : nombre de PD par 100 cases. Rouge = bondé, sombre = vide.</li><li><b>Niveau moyen des PD</b> : niveau moyen des PD de la zone. Rouge = forts (niv 15+), bleu = faibles (niv 3–5).</li><li>Les couleurs sont lissées entre les captures : c'est une estimation. Les zones loin de toute capture s'estompent.</li></ul>", "ab3_h": "Limites", "ab3_b": "<ul><li>Hors de notre zone : une capture par bloc, des petits groupes peuvent manquer.</li><li>La Banlieue et le Centre sont dans le brouillard et non cartographiés.</li><li>Les positions des R5 / R4 des autres alliances ne sont pas encore connues.</li><li>Pas de liste de joueurs : les noms n'étaient lisibles qu'en partie, ils sont omis tant qu'une zone n'est pas entièrement couverte.</li><li>Les PD bougent. C'est un instantané du 18 nov.</li><li>[xlx] est sans doute XIX (NAP). [Arc] et [ARC] sont sans doute la même alliance.</li></ul>", "ab4_h": "Score de menace", "ab4_b": "<ul><li>Seulement pour les alliances de notre zone entièrement scannée : MVD, Art, SKY, Arc, A0I, TTn, OPG, AME.</li><li>Score = PD vus × niveau moyen ÷ distance à notre QG (plus proche = plus élevé), ramené à 100 pour le plus haut.</li><li>Il mesure la taille, la force et la proximité, pas les intentions. Pour cela, utilisez les relations et les mises à jour.</li></ul>", "ab5_h": "Relations et mises à jour", "ab5_b": "<ul><li>Vert Amicale · Orange Inamicale · Rouge Ennemie · Gris Neutre · Gris pointillé Inconnue.</li><li>Les relations se fixent entre deux alliances quelconques, pas seulement avec nous. Elles apparaissent en lignes sur la carte et dans l'onglet Diplomatie.</li><li>Les changements et mises à jour sont enregistrés pour tous ceux qui peuvent modifier cette page (partagez-la avec vos R4 en Contributor ou Editor).</li><li>Chaque mise à jour porte l'heure serveur et son auteur.</li></ul>", "ab6_h": "Alliances NAP", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ.</p>", "lang": "Langue", "cb_res": "Ressources d'alliance occupées", "th_res": "Ressources", "ins7_h": "Prisons de la campagne (les 12)", "ins7_n": "Les 12 sont tenues par des membres du NAP. Lu à 11:05 heure serveur, 18 nov ; toutes protégées ~1j 12h.", "ins8_h": "Ressources d'alliance occupées", "ins8_n": "Vues sur les captures. Précises dans notre zone (±3 cases), approximatives ailleurs (±15). Grande icône = occupée par le NAP.", "res_cash": "Entrepôt d'argent", "res_ammo": "Dépôt de munitions", "res_elec": "Poste électrique", "res_gas": "Station-service", "set_h": "Définir une relation", "set_hint": "Choisissez deux alliances et touchez un statut. Enregistré pour tous ceux qui peuvent modifier.", "set_a": "Alliance", "set_with": "avec", "set_kvk": "✎ Relation avec KVK", "heat_t": "Menace", "lg_t1": "faible", "lg_t2": "menace forte", "heat_t_note": "Carte de menace : seulement notre zone entièrement scannée. Force × proximité, plus haute pour Ennemie/Inamicale, nulle pour Amicale.", "tab_hist": "Historique", "hist_all": "Tout", "hist_rel": "Relations", "hist_upd": "Mises à jour", "hist_empty": "Rien pour l'instant. Définissez une relation ou ajoutez une info et elle apparaîtra ici.", "hist_any": "Toutes les alliances", "exp_dip": "🖼 Exporter l'image diplomatie", "exp_map": "🖼 Exporter l'image de la carte", "exp_txt": "📋 Copier pour Discord", "exp_ok": "Enregistré – publiez-le sur Discord.", "exp_fail": "Export indisponible ici.", "copied": "Copié – collez-le dans Discord.", "exp_h": "Partager", "txt_title": "Diplomatie KVK – État #205", "pub_banner": "Copie en lecture seule, mise à jour {d}. Demandez les changements aux R4 de KVK."}, "de": {"r4_btn": "🔒 R4-Berichte", "title": "Staat #205 – Karte des Umlands", "sub": "Gescannt am 18. Nov 2026, 09:40–10:23 Serverzeit · Karte wie im Spiel ausgerichtet (oben = +X+Y)", "st_screens": "Screenshots", "st_pds": "PDs gezählt", "st_all": "Allianzen gefunden", "st_nap": "NAP-Allianzen", "tab_map": "Karte", "tab_dip": "Diplomatie", "tab_ins": "Wichtigs : "Update zu [{t}] hinzufügen… (wer führt, Aktivität, Angriffe, Absprachen)", "add_btn": "Hinzufügen", "saved_db": "Gespeichert für alle mit Bearbeitungsrecht", "saved_local": "Nur in diesem Browser gespeichert", "read_only": "Du kannst Updates lesen, aber nicht hinzufügen.", "no_upd": "Noch keine Updates.", "by_claude": "Claude (Karten-Scan)", "someone": "Jemand", "save_err": "Speichern fehlgeschlagen – vielleicht hast du nur Lesezugriff.", "quota": "Speicher voll – lösche zuerst alte Updates.", "rel_change": "Beziehung [{a}] ↔ [{b}]: {o} → {n}", "pair_apart": "{d} Felder voneinander", "both_nap": "beide NAP", "open_all": "Allianz öffnen:", "area_title": "Gebiet bei {x} / {y}", "area_ring": "Unser Gebiet – lückenlos gescannt", "area_survey": "Stichproben-Screenshot für diesen 100×100-Block", "pds_on": "PDs im Bild", "avg_level": "Ø Level", "no_tags": "Keine Allianz-Tags – inaktive/ungebundene PDs", "pds_lbl": "PDs:", "bld": "Gebäude:", "held_by": "Gehalten von", "owner_unread": "Besitzer nicht gelesen", "dens_unit": "PDs / 100 Felder", "shot_tip": "Screenshot {x}/{y}: {n} PDs", "us": "wir", "nap": "NAP", "notnap": "kein NAP", "nomatch": "Kein Treffer", "dip_area": "Unser Gebiet", "dip_all": "Ganzer Staat", "dip_help": "Allianzen stehen dort, wo sie auf der Karte sind. Linien verbinden Nachbarn und jedes Paar mit bekannter Beziehung. Tippe auf eine Linie, um die Beziehung der beiden festzulegen; tippe auf einen Kreis für die Allianz. Zahl im Kreis = gesehene PDs.", "dip_our": "Unsere Beziehungen", "dip_start": "Startpunkt: NAP-Mitglieder sind untereinander freundlich, der Rest unbekannt. Jede Änderung wird in den Updates beider Allianzen vermerkt.", "dip_allnap": "Alle NAP-Verbindungen zeigen (66 Linien)", "dip_hint": "Tippe auf eine Linie oder einen Kreis.", "dip_napm": "NAP-Mitglied", "dip_other": "Andere Allianz", "dip_thr": "⚠ = Bedrohungswert", "area_banner": "Dichter Scan (ohne Lücken) von etwa 260×250 Feldern um unser HQ bei 883/155. Entfernungen in Luftlinie vom HQ.", "area_tap": "Tippen, um auf der Karte zu zeigen →", "th_fac": "Allianz", "th_rel": "Beziehung", "th_nap": "NAP", "th_thr": "Bedrohung", "th_loc": "Position", "th_dist": "Felder von KVK", "th_pds": "PDs gesehen", "th_avg": "Ø Lv", "th_range": "Level-Spanne", "th_latest": "Letztes Update / was ich sah", "ph_filter": "Allianzen filtern…", "th_res": "Ressourcen", "sh_ring": "Unser Gebiet (38)", "sh_all": "Ganzes Umland (108)", "data_note": "Scan-Notizen (Namen, Gebäude) bleiben auf Englisch.", "ins_thr_h": "Bedrohungs-Ranking (komplett gescannte Nachbarn)", "ins_thr_row": "{n} PDs, Ø Lv {a}, {d} Felder", "ins_thr_n": "Andere fehlen: nicht komplett gescannt.", "ins1_h": "Direkte Nachbarn im Blick", "ins1_b": "<p>Keine NAP-Allianz grenzt an uns. Die nächste NAP-Präsenz ist [TCE] mit Gefängnis Nr. 7 (~208 Felder, Richtung Vorstadt).</p><ul><li><b>[MVD]</b> – zwischen uns und der Vorstadt; ihre Flaggen <b>berühren unsere Grenze</b> bei ~945/235. Kein NAP. Niedrige Level gesehen (8–11).</li><li><b>[Art]</b> – direkt an uns (~38 Felder), ~40 PDs, bis Lv 16.</li><li><b>[SKY] / [Arc] / [SPi]</b> – ein großer Block rechts von uns auf der Karte, zusammen ~85 PDs.</li><li><b>[TTn]</b> (Tresorfalle 1) und <b>[A0I]</b> (HQ, Lv 18) links von uns.</li></ul>", "ins2_h": "Stärkste Allianzen (nach PD-Level)", "ins2_b": "<ul><li><b>[Kgb]</b> (NAP) Lv 16–19. Bei 450–550 / 250.</li><li><b>[ZZZ]</b> (NAP) Ø Lv 15,5, ~25 PDs. Bei 550 / 150.</li><li><b>[AYE]</b> Ø Lv 14. Bei 250 / 750.</li><li><b>[ABC]</b> Ø Lv 13,5, ~27 PDs. Bei 350 / 150.</li><li><b>[TB4]</b> ~35 PDs, Lv 7–17. Bei 750 / 250 – direkt links von uns.</li><li><b>[lsq]</b>, <b>[KNP]</b>, <b>[ToF]</b> ebenfalls Ø Lv 13.</li></ul>", "ins3_h": "Größte Gruppen (meiste PDs)", "ins3_b": "<ul><li><b>[sur]</b> ~45 PDs bei 950 / 1050</li><li><b>[Art]</b> ~40 bei 845 / 150 (unser Nachbar)</li><li><b>[TB4]</b> ~35 bei 750 / 250</li><li><b>[DUA]</b>, <b>[Det]</b>, <b>[lsq]</b>, <b>[SKY]</b>, <b>[Arc]</b> je ~30</li></ul>", "ins4_h": "Wo die NAP-Allianzen sitzen", "ins4_b": "<ul><li><b>Untere Kartenseite:</b> [Kgb], [ZZZ], [Aur], [TRK]</li><li><b>Linke Seite:</b> [POL], [RED]</li><li><b>Rechts oben:</b> [xlx] (XIX), [PoH]</li><li><b>Gefängnisse:</b> alle 12 im Umland gehören NAP-Mitgliedern</li><li>In unserer Kartenecke gibt es <b>keine NAP-Mitglieder</b> – alle Nachbarn sind außerhalb des NAP.</li></ul>", "ins5_h": "Leere / inaktive Zonen", "ins5_b": "<ul><li>Der rechte untere Kartenrand (Y 0–100, wo wir sind) und die fernen Ecken sind voller PDs ohne Tag \"Chief####\", Lv 3–9 – inaktive oder Farm-Accounts.</li><li>Die braunen/grauen Streifen direkt vor der Vorstadt sind Gefängniszonen: keine PDs, nur Kriminelle.</li><li>Diese ruhigen Zonen sind die sichersten Orte, um schwächere Mitglieder umzusiedeln oder sich zu sammeln.</li></ul>", "ins6_h": "Orte in unserer Nähe", "ins6_b": "<ul><li>Unser HQ 883/155 mit Tresorfalle 1 & 2.</li><li>Wir halten das Krimlabor Lv1 bei ~956/237 (neben MVD).</li><li>Wir halten Gefängnis Nr. 6 bei 846/237.</li><li>Tresorfalle 2 von [ARC] bei ~985/262 und Tresorfalle 1 von [TTn] bei ~800/185.</li></ul>", "ins7_h": "Gefängnisse im Umland (alle 12)", "ins7_n": "Alle 12 gehören NAP-Mitgliedern. Gelesen um 11:05 Serverzeit, 18. Nov; alle ~1 T 12 Std geschützt.", "ins8_h": "Beanspruchte Allianz-Ressourcen", "ins8_n": "Auf den Screenshots gesehen. Genau in unserem Gebiet (±3 Felder), sonst ungefähr (±15). Großes Symbol = NAP-Anspruch.", "res_cash": "Geldlager", "res_ammo": "Munitionslager", "res_elec": "Strommast", "res_gas": "Tankstelle", "ab1_h": "Wie es gemacht wurde", "ab1_b": "<ul><li>108 Stichproben-Screenshots, einer pro 100×100-Feld-Block.</li><li>38 zusätzliche Screenshots ohne Lücken um unser HQ.</li><li>Auf jedem Screenshot habe ich PDs, ihre Level und Allianz-Tags gezählt.</li><li>Alle 12 Gefängnisse im Umland einzeln im Spiel geöffnet.</li></ul>", "ab2_h": "Heatmap", "ab2_b": "<ul><li><b>PD-Dichte</b>: wie viele PDs pro 100 Felder. Rot = voll, dunkel = leer.</li><li><b>Ø PD-Level</b>: Durchschnittslevel der PDs dort. Rot = stark (Lv 15+), blau = schwach (Lv 3–5).</li><li>Farben sind zwischen Screenshots geglättet – eine Schätzung. Stellen weit weg von jedem Screenshot verblassen.</li></ul>", "ab3_h": "Grenzen", "ab3_b": "<ul><li>Außerhalb unseres Gebiets: ein Screenshot pro Block, kleine Gruppen können fehlen.</li><li>Vorstadt und Innenstadt sind im Nebel und nicht kartiert.</li><li>R5 / R4-Positionen anderer Allianzen sind noch unbekannt.</li><li>Keine Spielerlisten: Namen waren nur teils lesbar, daher erst, wenn ein Gebiet komplett abgedeckt ist.</li><li>PDs ziehen um. Dies ist ein Stand vom 18. Nov.</li><li>[xlx] ist vermutlich XIX (NAP). [Arc] und [ARC] sind vermutlich dieselbe Allianz.</li></ul>", "ab4_h": "Bedrohungswert", "ab4_b": "<ul><li>Nur für Allianzen in unserem komplett gescannten Gebiet: MVD, Art, SKY, Arc, A0I, TTn, OPG, AME.</li><li>Wert = gesehene PDs × Ø Level ÷ Entfernung zu unserem HQ (näher zählt mehr), skaliert auf höchster = 100.</li><li>Er misst Größe, Stärke und Nähe – nicht Absichten. Dafür Beziehungen und Updates nutzen.</li></ul>", "ab5_h": "Beziehungen & Updates", "ab5_b": "<ul><li>Grün Freundlich · Orange Unfreundlich · Rot Feind · Grau Neutral · Grau gestrichelt Unbekannt.</li><li>Beziehungen gelten zwischen zwei beliebigen Allianzen, nicht nur zu uns. Sie erscheinen als Linien auf der Karte und im Tab Diplomatie.</li><li>Änderungen und Updates werden für alle gespeichert, die die Seite bearbeiten dürfen (mit R4s als Contributor oder Editor teilen).</li><li>Jedes Update trägt Serverzeit und Verfasser.</li></ul>", "ab6_h": "NAP-Allianzen", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ.</p>", "lang": "Sprache", "set_h": "Beziehung festlegen", "set_hint": "Wähle zwei Allianzen und tippe auf einen Status. Für alle mit Bearbeitungsrecht gespeichert.", "set_a": "Allianz", "set_with": "mit", "set_kvk": "✎ Beziehung zu KVK festlegen", ><ul><li><b>[MVD]</b> – 位于我们与郊区之间;旗帜在约945/235处<b>与我方边界相接</b>。非NAP。看到的等级较低(8–11)。</li><li><b>[Art]</b> – 紧贴我们(约38格),约40个PD,最高16级。</li><li><b>[SKY] / [Arc] / [SPi]</b> – 地图上在我们右侧的一大块,共约85个PD。</li><li><b>[TTn]</b>(金库陷阱1)和 <b>[A0I]</b>(总部,18级)在我们左侧。</li></ul>", "ins2_h": "最强联盟(按PD等级)", "ins2_b": "<ul><li><b>[Kgb]</b>(NAP)16–19级。约450–550 / 250。</li><li><b>[ZZZ]</b>(NAP)平均15.5级,约25个PD。约550 / 150。</li><li><b>[AYE]</b> 平均14级。约250 / 750。</li><li><b>[ABC]</b> 平均13.5级,约27个PD。约350 / 150。</li><li><b>[TB4]</b> 约35个PD,7–17级。约750 / 250 – 就在我们左边。</li><li><b>[lsq]</b>、<b>[KNP]</b>、<b>[ToF]</b> 平均也在13级。</li></ul>", "ins3_h": "最大集群(PD最多)", "ins3_b": "<ul><li><b>[sur]</b> 约45个PD,950 / 1050</li><li><b>[Art]</b> 约40个,845 / 150(我们的邻居)</li><li><b>[TB4]</b> 约35个,750 / 250</li><li><b>[DUA]</b>、<b>[Det]</b>、<b>[lsq]</b>、<b>[SKY]</b>、<b>[Arc]</b> 各约30个</li></ul>", "ins4_h": "NAP联盟的位置", "ins4_b": "<ul><li><b>地图下方:</b>[Kgb]、[ZZZ]、[Aur]、[TRK]</li><li><b>左侧:</b>[POL]、[RED]</li><li><b>右上方:</b>[xlx](XIX)、[PoH]</li><li><b>监狱:</b>郊野全部12座均由NAP成员占领</li><li>我们所在的角落<b>没有NAP成员</b> – 所有邻居都不在NAP内。</li></ul>", "ins5_h": "空旷 / 不活跃区域", "ins5_b": "<ul><li>地图右下边缘(Y 0–100,我们所在)和远处角落满是无标签的\"Chief####\" PD,3–9级 – 不活跃或农场账号。</li><li>郊区外侧的棕/灰色带是监狱区:没有PD,只有罪犯。</li><li>这些安静区域最适合安置较弱的成员或集合。</li></ul>", "ins6_h": "我们附近的地点", "ins6_b": "<ul><li>我方总部 883/155,含金库陷阱1和2。</li><li>我们占领了1级犯罪实验室,约956/237(MVD旁边)。</li><li>我们占领了6号监狱,846/237。</li><li>[ARC]的金库陷阱2约在985/262,[TTn]的金库陷阱1约在800/185。</li></ul>", "ins7_h": "郊野监狱(全部12座)", "ins7_n": "全部由NAP成员占领。读取时间:11月18日 11:05(服务器);均有约1天12小时保护。", "ins8_h": "已占领的联盟资源点", "ins8_n": "根据截图统计。我方区域内精确(±3格),其他为近似(±15)。大图标 = NAP占领。", "res_cash": "现金仓库", "res_ammo": "弹药库", "res_elec": "电力站", "res_gas": "加油站", "ab1_h": "制作方法", "ab1_b": "<ul><li>108张抽样截图,每个100×100格区块一张。</li><li>在我方总部周围额外无缝截图38张。</li><li>每张截图统计PD数量、等级和联盟标签。</li><li>郊野12座监狱逐一在游戏中查看。</li></ul>", "ab2_h": "热力图", "ab2_b": "<ul><li><b>PD密度</b>:每100格有多少PD。红 = 拥挤,暗 = 空。</li><li><b>PD平均等级</b>:该区域PD的平均等级。红 = 强(15级+),蓝 = 弱(3–5级)。</li><li>颜色在截图之间平滑过渡,仅为估计。离截图越远越淡。</li></ul>", "ab3_h": "局限", "ab3_b": "<ul><li>我方区域以外:每个区块一张截图,小团体可能遗漏。</li><li>郊区和市中心有迷雾,未测绘。</li><li>其他联盟R5 / R4的位置尚不清楚。</li><li>没有玩家列表:名字只能部分读出,区域完整覆盖前不列出。</li><li>PD会搬家。这是11月18日的快照。</li><li>[xlx] 可能是 XIX(NAP)。[Arc] 和 [ARC] 可能是同一联盟。</li></ul>", "ab4_h": "威胁值", "ab4_b": "<ul><li>仅针对我方完整扫描区域内的联盟:MVD、Art、SKY、Arc、A0I、TTn、OPG、AME。</li><li>威胁值 = PD数 × 平均等级 ÷ 到我方总部的距离(越近越高),最高者 = 100。</li><li>衡量规模、实力与距离,而非意图。意图请看关系和动态。</li></ul>", "ab5_h": "关系与动态", "ab5_b": "<ul><li>绿 友好 · 橙 不友好 · 红 敌对 · 灰 中立 · 灰色虚线 未知。</li><li>关系可设在任意两个联盟之间,不仅是与我们。在地图上显示为连线,也在外交标签页中显示。</li><li>修改和动态会为所有可编辑此页面的人保存(以Contributor或Editor身份分享给R4)。</li><li>每条动态记录服务器时间和作者。</li></ul>", "ab6_h": "NAP联盟", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ。</p>", "lang": "语言", "set_h": "设置关系", "set_hint": "选择两个联盟,点击一个状态。修改会为所有有编辑权限的人保存。", "set_a": "联盟", "set_with": "与", "set_kvk": "✎ 设置与KVK的关系", "heat_t": "威胁", "lg_t1": "低", "lg_t2": "高威胁", "heat_t_note": "威胁热力图:仅限我方完整扫描区域。实力×距离,敌对/不友好更高,友好为零。", "tab_hist": "历史", "hist_all": "全部", "hist_rel": "关系", "hist_upd": "动态", "hist_empty": "暂无记录。设置关系或添加动态后会显示在这里。", "hist_any": "全部联盟", "exp_dip": "🖼 导出外交图", "exp_map": "🖼 导出地图", "exp_txt": "📋 复制到Discord", "exp_ok": "已保存 – 发到Discord吧。", "exp_fail": "此处无法导出。", "copied": "已复制 – 粘贴到Discord。", "exp_h": "分享", "txt_title": "KVK外交 – #205州", "pub_banner": "只读副本,更新于 {d}。如需修改请联系KVK的R4。"}, "it": {"r4_btn": "🔒 Report R4", "title": "Stato #205 – Mappa della campagna", "sub": "Scansione del 18 nov 2026, 09:40–10:23 ora del server · mappa orientata come nel gioco (su = +X+Y)", "st_screens": "screenshot", "st_pds": "PD contati", "st_all": "alleanze trovate", "st_nap": "alleanze NAP", "tab_map": "Mappa", "tab_dip": "Diplomazia", "tab_ins": "Punti chiave", "tab_area": "La nostra zona", "tab_fac": "Tutte le alleanze", "tab_shots": "Screenshot", "tab_about": "Come leggerla", "b_kvk": "⌖ Vai a KVK", "b_all": "⤢ Tutto lo stato", "legend": "Legenda", "h_heat": "Mappa di calore", "heat_d e", "th_dist": "Caselle da KVK", "th_pds": "PD visti", "th_avg": "Liv medio", "th_range": "Livelli", "th_latest": "Ultimo aggiornamento / cosa ho visto", "ph_filter": "Filtra alleanze…", "th_res": "Risorse", "sh_ring": "La nostra zona (38)", "sh_all": "Tutta la campagna (108)", "data_note": "Le note della scansione (nomi, edifici) restano in inglese.", "ins_thr_h": "Classifica minacce (vicini scansionati del tutto)", "ins_thr_row": "{n} PD, liv medio {a}, {d} caselle", "ins_thr_n": "Le altre sono escluse: non scansionate del tutto.", "ins1_h": "Vicini diretti da tenere d'occhio", "ins1_b": "<p>Nessuna alleanza NAP confina con noi. La presenza NAP più vicina è [TCE] con la Prigione n. 7 (~208 caselle, verso la Periferia).</p><ul><li><b>[MVD]</b> – tra noi e la Periferia; le loro bandiere <b>toccano il nostro confine</b> a ~945/235. Non NAP. Livelli bassi visti (8–11).</li><li><b>[Art]</b> – attaccata a noi (~38 caselle), ~40 PD, fino al liv 16.</li><li><b>[SKY] / [Arc] / [SPi]</b> – un grande blocco alla nostra destra sulla mappa, ~85 PD in tutto.</li><li><b>[TTn]</b> (Trappola-caveau 1) e <b>[A0I]</b> (QG, liv 18) alla nostra sinistra.</li></ul>", "ins2_h": "Alleanze più forti (per livello PD)", "ins2_b": "<ul><li><b>[Kgb]</b> (NAP) liv 16–19. Vicino a 450–550 / 250.</li><li><b>[ZZZ]</b> (NAP) liv medio 15,5, ~25 PD. Vicino a 550 / 150.</li><li><b>[AYE]</b> liv medio 14. Vicino a 250 / 750.</li><li><b>[ABC]</b> liv medio 13,5, ~27 PD. Vicino a 350 / 150.</li><li><b>[TB4]</b> ~35 PD, liv 7–17. Vicino a 750 / 250 – subito a sinistra di noi.</li><li><b>[lsq]</b>, <b>[KNP]</b>, <b>[ToF]</b> anch'esse liv medio 13.</li></ul>", "ins3_h": "Gruppi più grandi (più PD)", "ins3_b": "<ul><li><b>[sur]</b> ~45 PD a 950 / 1050</li><li><b>[Art]</b> ~40 a 845 / 150 (nostra vicina)</li><li><b>[TB4]</b> ~35 a 750 / 250</li><li><b>[DUA]</b>, <b>[Det]</b>, <b>[lsq]</b>, <b>[SKY]</b>, <b>[Arc]</b> ~30 ciascuna</li></ul>", "ins4_h": "Dove stanno le alleanze NAP", "ins4_b": "<ul><li><b>Lato inferiore della mappa:</b> [Kgb], [ZZZ], [Aur], [TRK]</li><li><b>Lato sinistro:</b> [POL], [RED]</li><li><b>In alto a destra:</b> [xlx] (XIX), [PoH]</li><li><b>Prigioni:</b> tutte le 12 della campagna sono di membri NAP</li><li>Il nostro angolo di mappa <b>non ha membri NAP</b> – tutti i vicini sono fuori dal NAP.</li></ul>", "ins5_h": "Zone vuote / inattive", "ins5_b": "<ul><li>Il bordo in basso a destra della mappa (Y 0–100, dove siamo) e gli angoli lontani sono pieni di PD senza tag \"Chief####\", liv 3–9 – account inattivi o farm.</li><li>Le fasce marroni/grigie appena fuori dalla Periferia sono zone prigione: niente PD, solo criminali.</li><li>Queste zone tranquille sono i posti più sicuri per spostare i membri deboli o radunarsi.</li></ul>", "ins6_h": "Luoghi vicino a noi", "ins6_b": "<ul><li>Il nostro QG 883/155 con Trappole-caveau 1 e 2.</li><li>Teniamo il Laboratorio criminale liv1 a ~956/237 (vicino a MVD).</li><li>Teniamo la Prigione n. 6 a 846/237.</li><li>Trappola-caveau 2 di [ARC] a ~985/262 e Trappola-caveau 1 di [TTn] a ~800/185.</li></ul>", "ins7_h": "Prigioni della campagna (tutte 12)", "ins7_n": "Tutte di membri NAP. Lette alle 11:05 ora server, 18 nov; tutte protette per ~1g 12h.", "ins8_h": "Risorse d'alleanza occupate", "ins8_n": "Viste negli screenshot. Precise nella nostra zona (±3 caselle), altrove approssimate (±15). Icona grande = occupata da NAP.", "res_cash": "Deposito contanti", "res_ammo": "Deposito munizioni", "res_elec": "Centralina elettrica", "res_gas": "Stazione di servizio", "ab1_h": "Come è stata fatta", "ab1_b": "<ul><li>108 screenshot a campione, uno per blocco di 100×100 caselle.</li><li>38 screenshot extra senza buchi attorno al nostro QG.</li><li>In ogni screenshot ho contato i PD, i loro livelli e i tag d'alleanza.</li><li>Tutte le 12 prigioni della campagna aperte una per una nel gioco.</li></ul>", "ab2_h": "Mappa di calore", "ab2_b": "<ul><li><b>Densità PD</b>: quanti PD ogni 100 caselle. Rosso = affollato, scuro = vuoto.</li><li><b>Livello medio PD</b>: livello medio dei PD della zona. Rosso = forti (liv 15+), blu = deboli (liv 3–5).</li><li>I colori sono sfumati tra gli screenshot: è una stima. Le zone lontane dagli screenshot sbiadiscono.</li></ul>", "ab3_h": "Limiti", "ab3_b": "<ul><li>Fuori dalla nostra zona: uno screenshot per blocco, piccoli gruppi possono mancare.</li><li>Periferia e Centro sono nella nebbia e non mappati.</li><li>Le posizioni di R5 / R4 delle altre alleanze non sono ancora note.</li><li>Nessuna lista di giocatori: i nomi erano leggibili solo in parte, quindi omessi finché una zona non è coperta del tutto.</li><li>I PD si spostano. È una foto del 18 nov.</li><li>[xlx] è probabilmente XIX (NAP). [Arc] e [ARC] sono probabilmente la stessa alleanza.</li></ul>", "ab4_h": "Punteggio minaccia", "ab4_b": "<ul><li>Solo per le alleanze della nostra zona scansionata del tutto: MVD, Art, SKY, Arc, A0I, TTn, OPG, AME.</li><li>Punteggio = PD visti × livello medio ÷ distanza dal nostro QG (più vicino conta di più), scalato così che il più alto = 100.</li><li>Misura dimensione, forza e vicinanza – non le intenzioni. Per quelle usa relazioni e aggiornamenti.</li></ul>", "ab5_h": "Relazioni e aggiornamenti", "ab5_b": "<ul><li>Verde Amica · Arancione Ostile · Rosso Nemica · Grigio Neutrale · Grigio tratteggiato Sconosciuta.</li><li>Le relazioni valgono tra due alleanze qualsiasi, non solo con noi. Appaiono come linee sulla mappa e nella scheda Diplomazia.</li><li>Cambi e aggiornamenti sono salvati per tutti quelli che possono modificare la pagina (condividila con i tuoi R4 come Contributor o Editor).</li><li>Ogni aggiornamento riporta ora del server e autore.</li></ul>", "ab6_h": "Alleanze NAP", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ.</p>", "lang": "Lingua", "set_h": "Imposta una relazione", "set_hint": "Scegli due alleanze e tocca uno stato. Salvato per tutti con permesso di modifica.", "set_a": "Alleanza", "set_with": "con", "set_kvk": "✎ Relazione con KVK", "heat_t": "Minaccia", "lg_t1": "bassa", "lg_t2": "minaccia alta", "heat_t_note": "Mappa minaccia: solo la nostra zona scansionata del tutto. Forza × vicinanza, più alta per Nemica/Ostile, zero per Amica.", "tab_hist": "Cronologia", "hist_all": "Tutto", "hist_rel": "Relazioni", "hist_upd": "Aggiornamenti", "hist_empty": "Ancora niente. Imposta una relazione o aggiungi un aggiornamento e comparirà qui.", "hist_any": "Tutte le alleanze", "exp_dip": "🖼 Esporta immagine diplomazia", "exp_map": "🖼 Esporta immagine mappa", "exp_txt": "📋 Copia per Discord", "exp_ok": "Salvato – pubblicalo su Discord.", "exp_fail": "Esportazione non disponibile qui.", "copied": "Copiato – incollalo su Discord.", "exp_h": "Condividi", "txt_title": "Diplomazia KVK – Stato #205", "pub_banner": "Copia in sola lettura, aggiornata {d}. Chiedi modifiche agli R4 di KVK."}, "pt": {"r4_btn": "🔒 Relatórios R4", "title": "Estado #205 – Mapa do interior", "sub": "Escaneado em 18 nov 2026, 09:40–10:23 hora do servidor · mapa orientado como no jogo (cima = +X+Y)", "st_screens": "capturas", "st_pds": "PDs contados", "st_all": "alianças encontradas", "st_nap": "alianças NAP", "tab_map": "Mapa", "tab_dip": "Diplomacia", "tab_ins": "Destaques", "tab_area": "Nossa área", "tab_fac": "Todas as alianças", "tab_shots": "Capturas", "tab_about": "Como ler", "b_kvk": "⌖ Ir para KVK", "b_all": "⤢ Estado inteiro", "legend": "Legenda", "h_heat": "Mapa de calor", "heat_d": "Densidade de PDs", "heat_l": "Nível médio dos PDs", "off": "Desligado", "h_col": "Colorir alianças por", "col_rel": "Relação", "col_nap": "NAP ou não", "h_show": "Mostrar no mapa", "cb_fac": "Alianças (círculos + tags)", "cb_links": "Linhas de relação entre alianças", "cb_places": "QGs, prisões, cofres-armadilha, laboratórios", "cb_nap": "Só alianças NAP", "cb_pts": "Onde tirei as capturas", "cb_res": "Recursos de aliança ocupados", "h_find": "Procurar aliança", "ph_find": "ex. MVD", "h_sel": "Selecionado", "sel_hint": "Toque no círculo de uma aliança, num edifício ou em qualquer ponto do mapa.", "lg_empty": "vazio", "lg_dens": "8+ PDs / 100 casas", "lg_lv": "nv 3", "lg_lv2": "nv 16+", "lg_us": "Nós", "lg_nap": "NAP", "lg_notnap": "Fora do NAP", "lg_size": "Tamanho do círculo = PDs vistos · ★ QG · ⬢ prisão · V cofre-armadilha · L lab · ■ recurso (grande = NAP)", "fog1": "Subúrbio + Centro", "fog2": "na névoa – não mapeado", "gapless": "escaneado sem falhas", "r_friendly": "Amigável", "r_unfriendly": "Hostil", "r_enemy": "Inimiga", "r_neutral": "Neutra", "r_unknown": "Desconhecida", "pds_seen": "PDs vistos", "level": "nível", "avg": "média", "tiles_from": "casas do KVK", "around": "perto de", "fully": "escaneada por completo", "partly": "vista em parte", "rel_us": "A relação deles conosco:", "rel_others": "As relações deles com outras", "tiles": "casas", "threat": "Ameaça", "thr_na_full": "Ameaça: não calculada – sem dados de nível desta aliança.", "thr_na_part": "Ameaça: não calculada – não escaneada por completo, quadro incompleto.", "thr_calc": "{n} PDs × nv médio {a} a {d} casas", "art_note": "A contagem inclui alguns PDs sem tag entre membros da Art, então pode estar um pouco alta.", "shots": "Capturas:", "updates": "Atualizações", "add_ph": "Adicione uma atualização sobre [{t}]… (quem lidera, atividade, ataques, acordos)", "add_btn": "Adicionar", "saved_db": "Salvo para todos com permissão de edição", "saved_local": "Salvo só neste navegador", "read_only": "Você pode ler as atualizações, mas não adicionar.", "no_upd": "Ainda sem atualizações.", "by_claude": "Claude (escaneamento do mapa)", "someone": "Alguém", "save_err": "Não foi possível salvar – talvez você só tenha acesso de leitura.", "quota": "Armazenamento cheio – apague atualizações antigas primeiro.", "rel_change": "Relação [{a}] ↔ [{b}]: {o} → {n}", "pair_apart": "a {d} casas de distância", "both_nap": "ambas NAP", "open_all": "Abrir aliança:", "area_title": "Área perto de {x} / {y}", "area_ring": "Nossa área – escaneada sem falhas", "area_survey": "Captura de amostra deste bloco 100×100", "pds_on": "PDs na tela", "avg_level": "nível médio", "no_tags": "Sem tags – PDs inativos ou sem aliança", "pds_lbl": "PDs:", "bld": "Edifícios:", "held_by": "Ocupado por", "owner_unread": "Dono não lido", "dens_unit": "PDs / 100 casas", "shot_tip": "Captura {x}/{y}: {n} PDs", "us": "nós", "nap": "NAP", "notnap": "fora do NAP", "nomatch": "Nada encontrado", "dip_area": "Nossa área", "dip_all": "Estado inteiro", "dip_help": "As alianças ficam onde estão no mapa. As linhas ligam vizinhas e qualquer par com relação conhecida. Toque numa linha para definir a relação entre essas duas alianças; toque num círculo para ver a aliança. Número no círculo = PDs vistos.", "dip_our": "Nossas relações", "dip_start": "Ponto de partida: membros do NAP são amigáveis entre si, o resto é desconhecido. Cada mudança é registrada nas atualizações das duas alianças.", "dip_allnap": "Mostrar todas as ligações NAP (66 linhas)", "dip_hint": "Toque numa linha ou num círculo.", "dip_napm": "Membro do NAP", "dip_other": "Outra aliança", "dip_thr": "⚠ = pontuação de ameaça", "area_banner": "Escaneamento denso (sem falhas) de cerca de 260×250 casas em volta do nosso QG em 883/155. Distâncias em linha reta a partir do QG.", "area_tap": "Toque para ver no mapa →", "th_fac": "Aliança", "th_rel": "Relação", "th_nap": "NAP", "th_thr": "Ameaça", "th_loc": "Local", "th_dist": "Casas do KVK", "th_pds": "PDs vistos", "th_avg": "Nv médio", "th_range": "Faixa de nível", "th_latest": "Última atualização / o que vi", "ph_filter": "Filtrar alianças…", "th_res": "Recursos", "sh_ring": "Nossa área (38)", "sh_all": "Interior inteiro (108)", "data_note": "As notas do escaneamento (nomes, edifícios) ficam em inglês.", "ins_thr_h": "Ranking de ameaça (vizinhos escaneados por completo)", "ins_thr_row": "{n} PDs, nv médio {a}, {d} casas", "ins_thr_n": "As outras ficam de fora: não escaneadas por completo.", "ins1_h": "Vizinhos diretos para vigiar", "ins1_b": "<p>Nenhuma aliança NAP faz fronteira conosco. A presença NAP mais próxima é [TCE] com a Prisão nº 7 (~208 casas, rumo ao Subúrbio).</p><ul><li><b>[MVD]</b> – entre nós e o Subúrbio; as bandeiras deles <b>tocam nossa fronteira</b> em ~945/235. Fora do NAP. Níveis baixos vistos (8–11).</li><li><b>[Art]</b> – colada em nós (~38 casas), ~40 PDs, até nv 16.</li><li><b>[SKY] / [Arc] / [SPi]</b> – um grande bloco à nossa direita no mapa, ~85 PDs juntos.</li><li><b>[TTn]</b> (Cofre-armadilha 1) e <b>[A0I]</b> (QG, nv 18) à nossa esquerda.</li></ul>", "ins2_h": "Alianças mais fortes (por nível de PD)", "ins2_b": "<ul><li><b>[Kgb]</b> (NAP) nv 16–19. Perto de 450–550 / 250.</li><li><b>[ZZZ]</b> (NAP) nv médio 15,5, ~25 PDs. Perto de 550 / 150.</li><li><b>[AYE]</b> nv médio 14. Perto de 250 / 750.</li><li><b>[ABC]</b> nv médio 13,5, ~27 PDs. Perto de 350 / 150.</li><li><b>[TB4]</b> ~35 PDs, nv 7–17. Perto de 750 / 250 – logo à nossa esquerda.</li><li><b>[lsq]</b>, <b>[KNP]</b>, <b>[ToF]</b> também com nv médio 13.</li></ul>", "ins3_h": "Maiores grupos (mais PDs)", "ins3_b": "<ul><li><b>[sur]</b> ~45 PDs em 950 / 1050</li><li><b>[Art]</b> ~40 em 845 / 150 (nossa vizinha)</li><li><b>[TB4]</b> ~35 em 750 / 250</li><li><b>[DUA]</b>, <b>[Det]</b>, <b>[lsq]</b>, <b>[SKY]</b>, <b>[Arc]</b> ~30 cada</li></ul>", "ins4_h": "Onde ficam as alianças NAP", "ins4_b": "<ul><li><b>Lado de baixo do mapa:</b> [Kgb], [ZZZ], [Aur], [TRK]</li><li><b>Lado esquerdo:</b> [POL], [RED]</li><li><b>Canto superior direito:</b> [xlx] (XIX), [PoH]</li><li><b>Prisões:</b> as 12 do interior são de membros do NAP</li><li>Nosso canto do mapa <b>não tem membros do NAP</b> – todos os vizinhos estão fora do NAP.</li></ul>", "ins5_h": "Zonas vazias / inativas", "ins5_b": "<ul><li>A borda inferior direita do mapa (Y 0–100, onde estamos) e os cantos distantes estão cheios de PDs sem tag \"Chief####\", nv 3–9 – contas inativas ou fazendas.</li><li>As faixas marrons/cinzas logo fora do Subúrbio são zonas de prisão: sem PDs, só criminosos.</li><li>Essas zonas calmas são os lugares mais seguros para mudar membros fracos ou se reunir.</li></ul>", "ins6_h": "Locais perto de nós", "ins6_b": "<ul><li>Nosso QG 883/155 com Cofres-armadilha 1 e 2.</li><li>Temos o Laboratório criminal nv1 em ~956/237 (ao lado da MVD).</li><li>Temos a Prisão nº 6 em 846/237.</li><li>Cofre-armadilha 2 da [ARC] em ~985/262 e Cofre-armadilha 1 da [TTn] em ~800/185.</li></ul>", "ins7_h": "Prisões do interior (todas as 12)", "ins7_n": "Todas de membros do NAP. Lidas às 11:05 hora do servidor, 18 nov; todas protegidas por ~1d 12h.", "ins8_h": "Recursos de aliança ocupados", "ins8_n": "Vistos nas capturas. Exatos na nossa área (±3 casas), aproximados no resto (±15). Ícone grande = ocupado por NAP.", "res_cash": "Depósito de dinheiro", "res_ammo": "Depósito de munição", "res_elec": "Posto elétrico", "res_gas": "Posto de gasolina", "ab1_h": "Como foi feito", "ab1_b": "<ul><li>108 capturas de amostra, uma por bloco de 100×100 casas.</li><li>38 capturas extras sem falhas em volta do nosso QG.</li><li>Em cada captura contei os PDs, os níveis e as tags de aliança.</li><li>As 12 prisões do interior abertas uma a uma no jogo.</li></ul>", "ab2_h": "Mapa de calor", "ab2_b": "<ul><li><b>Densidade de PDs</b>: quantos PDs a cada 100 casas. Vermelho = cheio, escuro = vazio.</li><li><b>Nível médio dos PDs</b>: nível médio dos PDs da área. Vermelho = fortes (nv 15+), azul = fracos (nv 3–5).</li><li>As cores são suavizadas entre capturas: é uma estimativa. Áreas longe de qualquer captura desbotam.</li></ul>", "ab3_h": "Limites", "ab3_b": "<ul><li>Fora da nossa área: uma captura por bloco, grupos pequenos podem faltar.</li><li>Subúrbio e Centro estão na névoa e não mapeados.</li><li>As posições de R5 / R4 das outras alianças ainda não são conhecidas.</li><li>Sem listas de jogadores: os nomes só eram legíveis em parte, então ficam de fora até a área estar coberta por completo.</li><li>PDs se mudam. É um retrato de 18 nov.</li><li>[xlx] provavelmente é XIX (NAP). [Arc] e [ARC] provavelmente são a mesma aliança.</li></ul>", "ab4_h": "Pontuação de ameaça", "ab4_b": "<ul><li>Só para alianças da nossa área escaneada por completo: MVD, Art, SKY, Arc, A0I, TTn, OPG, AME.</li><li>Pontuação = PDs vistos × nível médio ÷ distância ao nosso QG (mais perto pesa mais), escalada para a mais alta = 100.</li><li>Mede tamanho, força e proximidade – não intenção. Para isso use relações e atualizações.</li></ul>", "ab5_h": "Relações e atualizações", "ab5_b": "<ul><li>Verde Amigável · Laranja Hostil · Vermelho Inimiga · Cinza Neutra · Cinza tracejado Desconhecida.</li><li>As relações valem entre quaisquer duas alianças, não só conosco. Aparecem como linhas no mapa e na aba Diplomacia.</li><li>Mudanças e atualizações ficam salvas para todos que podem editar esta página (compartilhe com seus R4 como Contributor ou Editor).</li><li>Cada atualização leva a hora do servidor e o autor.</li></ul>", "ab6_h": "Alianças NAP", "ab6_b": "<p class=\"mut\" style=\"margin:0\">RED, POL, AUR, TRK, KGB, KVK, TCE, XIX, POH, CCC, UBR, ZZZ.</p>", "lang": "Idioma", "set_h": "Definir uma relação", "set_hint": "Escolha duas alianças e toque num status. Salvo para todos com permissão de edição.", "set_a": "Aliança", "set_with": "com", "set_kvk": "✎ Relação com KVK", "heat_t": "Ameaça", "lg_t1": "baixa", "lg_t2": "ameaça alta", "heat_t_note": "Mapa de ameaça: só nossa área escaneada por completo. Força × proximidade, maior para Inimiga/Hostil, zero para Amigável.", "tab_hist": "Histórico", "hist_all": "Tudo", "hist_rel": "Relações", "hist_upd": "Atualizações", "hist_empty": "Nada ainda. Defina uma relação ou adicione uma atualização e ela aparece aqui.", "hist_any": "Todas as alianças", "exp_dip": "🖼 Exportar imagem da diplomacia", "exp_map": "🖼 Exportar imagem do mapa", "exp_txt": "📋 Copiar para o Discord", "exp_ok": "Salvo – poste no Discord.", "exp_fail": "Exportação indisponível aqui.", "copied": "Copiado – cole no Discord.", "exp_h": "Compartilhar", "txt_title": "Diplomacia KVK – Estado #205", "pub_banner": "Cópia somente leitura, atualizada {d}. Peça mudanças aos R4 da KVK."}};</script>

 for(let j=0;j<G;j++)for(let i=0;i<G;i++){const X=i*STEP+2.5,Y=j*STEP+2.5;let sw=0,sd=0,swl=0,sl=0,near=0;

const LS='kvkmap.';function lsGet(k,d){try{return JSON.parse(localStorage.getItem(LS+k))??d}catch(e){return d}}function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}
function rerenderAll(){renderHist();delete heatImg.threat;renderIns();if(document.getElementById('setA').options.length)setBtns();legend();draw();renderF();renderArea();renderSpider();refreshDetails()}
async function setPair(a,b,r){const old=pairRel(a,b);if(old===r)return;const k=pid(a,b),at=new Date().toISOString();const[x,y]=k.split('~');REL[k]={a:x,b:y,rel:r,at,by:uid};
 rerenderAll();
 try{if(db){await db.collection('rel').doc(k).set({a:x,b:y,rel:r,at,by:uid||null});await db.collection('notes').add({tag:a,tag2:b,kind:'rel',a,b,from:old,to:r,text:'',at,by:uid||null,src:'rel'})}
  else{lsSet('rel',REL);NOTES.push({tag:a,tag2:b,kind:'rel',a,b,from:old,to:r,text:'',at,by:null,local:true});lsSet('notes',NOTES.filter(n=>n.local));rerenderAll()}}
 catch(e){canWrite=false;rerenderAll()}}
async function addNote(tag,text){const at=new Date().toISOString();if(db){await db.collection('notes').add({tag,text,at,by:uid||null,src:'user'})}else{NOTES.push({tag,text,at,by:null,local:true});lsSet('notes',NOTES.filter(n=>n.local));rerenderAll()}}
async function loadNames(){if(!usr)return;const ids=[...new Set(NOTES.map(n=>n.by).filter(b=>b&&b!=='claude'))];if(!ids.length)return;try{const ps=await usr.profiles(ids);for(const id of ids)names[id]=(ps[id]&&ps[id].name)||'';refreshDetails()}catch(e){}}
(async()=>{if(window.PUBLIC){await null;canWrite=false;REL=PUB.rel;NOTES=PUB.notes;Object.assign(names,PUB.names);const bn=document.getElementById('pubBanner');bn.style.display='block';bn.textContent=T('pub_banner',{d:stamp(PUB.at)});rerenderAll();return}try{if(!window.claude||!claude.use)throw 0;[db,usr]=await Promise.all([claude.use('db'),claude.use('user')]);}catch(e){db=null}
 if(usr){try{uid=await usr.id()}catch(e){}try{const c=await usr.can('data.write');if(c===false)canWrite=false}catch(e){}}
 if(!db){REL=lsGet('rel',{});NOTES=lsGet('notes',[]);rerenderAll();return}
 db.collection('rel').onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});REL=o;rerenderAll()},()=>{});
 db.collection('notes').onSnapshot(s=>{NOTES=s.docs.map(d=>({id:d.id,...d.data()}));rerenderAll();loadNames()},()=>{});})();

 document.querySelectorAll('[data-i]').forEach(e=>{if(e.id==='info'&&sel)return;if(e.id==='relInfo'&&(relF||relPair))return;e.textContent=T(e.dataset.i)});
 document.querySelectorAll('[data-ih]').forEach(e=>e.innerHTML=T(e.dataset.ih));document.querySelectorAll('[data-ip]').forEach(e=>e.placeholder=T(e.dataset.ip));
 document.getElementById('langSel').value=LANG;fillSetter();fillHistF();renderStats();rerenderAll();if(document.getElementById('v-shots').classList.contains('on'))renderShots()}

let histMode='all';document.querySelectorAll('#histSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#histSeg button').forEach(x=>x.classList.toggle('on',x===b));histMode=b.dataset.v;renderHist()});
function fillHistF(){const s=document.getElementById('histF'),v=s.value;s.innerHTML=`<option value="">${T('hist_any')}</option>`+[...FAC].sort((a,b)=>a.tag.localeCompare(b.tag)).map(f=>`<option value="${esc(f.tag)}">[${esc(f.tag)}]</option>`).join('');s.value=v}

function renderHist(){const el=document.getElementById('histList');if(!el)return;const fl=document.getElementById('histF').value;
 const ns=NOTES.filter(n=>(histMode==='all'||(histMode==='rel')===(n.kind==='rel'))&&(!fl||n.tag===fl||n.tag2===fl)).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
 el.innerHTML=ns.length?ns.map(n=>{const tags=[n.tag,n.tag2].filter(Boolean);const col=n.kind==='rel'?RC[n.to]||'#6b7783':'#5fc3ff';
  return`<div class="ev" style="border-left:3px solid ${col};margin-left:-13px;padding-left:10px"><div class="meta">${stamp(n.at)} · ${esc(n.by==='claude'?T('by_claude'):names[n.by]||T('someone'))} · ${tags.map(tg=>`<a href="#" class="hj" data-t="${esc(tg)}">[${esc(tg)}]</a>`).join(' ')}</div><div class="txt">${n.kind==='rel'?`<span class="rdot ${n.to}" style="${n.to==='unknown'?'':'background:'+RC[n.to]}"></span> `:''}${esc(noteText(n))}</div></div>`}).join(''):`<div class="mut">${T('hist_empty')}</div>`;
 el.querySelectorAll('.hj').forEach(a=>a.onclick=e=>{e.preventDefault();const f=FT[a.dataset.t];if(f)goMap(f)})}

let DL=null;(async()=>{if(window.PUBLIC)return;try{DL=await claude.use('downloads')}catch(e){}})();
function expMsg(k){document.querySelectorAll('.expMsg').forEach(e=>{e.textContent=T(k);setTimeout(()=>e.textContent='',5000)})}
async function savePng(cnv,name){const blob=await new Promise(r=>cnv.toBlob(r,'image/png'));if(!DL){if(window.PUBLIC){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();expMsg('exp_ok')}else expMsg('exp_fail');return}try{await DL.save({filename:name,data:blob});expMsg('exp_ok')}catch(e){if(e&&e.code!=='declined')expMsg('exp_fail')}}
function header(c,Wd,title,sub){c.fillStyle='#0e1317';c.fillRect(0,0,Wd,90);c.fillStyle='#e3eaf0';c.font='bold 34px system-ui';c.textAlign='left';c.fillText(title,30,48);c.fillStyle='#8f9eaa';c.font='18px system-ui';c.fillText(sub,30,76)}
async function exportDip(){const svg=document.getElementById('spider');const vb=svg.viewBox.baseVal;const S=2;const Wd=vb.width*S,Hd=vb.height*S+150;
 const xml=new XMLSerializer().serializeToString(svg).replace('<svg','<svg width="'+vb.width*S+'" height="'+vb.height*S+'"');const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);await img.decode();
 const cnv=document.createElement('canvas');cnv.width=Wd;cnv.height=Hd;const c=cnv.getContext('2d');c.fillStyle='#0e1317';c.fillRect(0,0,Wd,Hd);header(c,Wd,T('txt_title'),stamp(new Date().toISOString()));c.drawImage(img,0,90);
 let x=30;const y=Hd-30;c.font='20px system-ui';for(const[k,n,col]of RELS.map(a=>a)){c.strokeStyle=col;c.lineWidth=k==='unknown'?2:5;c.setLineDash(k==='unknown'?[6,5]:[]);c.beginPath();c.moveTo(x,y-7);c.lineTo(x+40,y-7);c.stroke();c.setLineDash([]);c.fillStyle='#c3ccd3';c.fillText(n,x+48,y);x+=c.measureText(n).width+90}
 await savePng(cnv,'kvk-diplomacy.png')}
async function exportMap(){const Wd=cv.width,Hd=cv.height+90*dpr;const cnv=document.createElement('canvas');cnv.width=Wd;cnv.height=Hd;const c=cnv.getContext('2d');c.fillStyle='#0e1317';c.fillRect(0,0,Wd,Hd);c.save();c.scale(dpr,dpr);header(c,Wd/dpr,T('title'),T('sub'));c.restore();c.drawImage(cv,0,90*dpr);await savePng(cnv,'kvk-map.png')}
async function copyTxt(){const lines=['**'+T('txt_title')+'**'];for(const k of['enemy','unfriendly','neutral','friendly']){const fs=FAC.filter(f=>!f.own&&relOf(f)===k).map(f=>'['+f.tag+']');if(fs.length)lines.push({enemy:'🔴',unfriendly:'🟠',neutral:'⚪',friendly:'🟢'}[k]+' **'+RN[k]+':** '+fs.join(' '))}
 const other=[];for(const k in REL){const r=REL[k];if(!r.rel||r.a==='KVK'||r.b==='KVK')continue;other.push({enemy:'🔴',unfriendly:'🟠',neutral:'⚪',friendly:'🟢',unknown:'❔'}[r.rel]+' ['+r.a+'] ↔ ['+r.b+']: '+RN[r.rel])}
 if(other.length)lines.push('',...other.slice(0,25));const recent=NOTES.filter(n=>n.kind!=='rel').sort((a,b)=>(b.at||'').localeCompare(a.at||'')).slice(0,5);if(recent.length){lines.push('','**'+T('updates')+'**');recent.forEach(n=>lines.push('• ['+n.tag+'] '+n.text.slice(0,140)))}
 let s=lines.join('\n');if(s.length>1900)s=s.slice(0,1900)+'…';try{await navigator.clipboard.writeText(s);expMsg('copied')}catch(e){expMsg('exp_fail')}}
document.querySelector('.expDip').onclick=exportDip;document.querySelector('.expTxt').onclick=copyTxt;document.getElementById('bExpMap').onclick=exportMap;
