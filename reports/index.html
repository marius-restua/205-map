<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KVK – R4 Reports</title>
<style>
:root{--bg:#0f1418;--card:#171e24;--line:#2a343d;--tx:#e6ebef;--mut:#93a1ad;--acc:#4f8cff}
*{box-sizing:border-box}
html{height:100%;overflow:hidden}body{height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
.wrap{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:none;margin:0;padding:24px max(16px,calc((100% - 900px)/2)) 64px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.top a{font-size:14px}
#lock{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
#lock h1{font-size:20px;margin:0 0 4px}
#lock p{color:var(--mut);margin:0 0 16px;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input[type=password]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0c1115;color:var(--tx);font-size:15px}
input[type=password]:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:14px;color:var(--mut)}
button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#err{color:#ff7a7a;font-size:14px;min-height:20px;margin-top:10px}
#out{display:none}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 20px 20px}
h1{font-size:22px}h2{font-size:18px;margin-top:28px;padding-top:12px;border-top:1px solid var(--line)}h3{font-size:15px;color:var(--mut);margin-bottom:4px}
.meta{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px;display:block;overflow-x:auto}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600}
pre{white-space:pre-wrap;background:#0c1115;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px}
hr{border:0;height:24px}
#tabs{position:sticky;top:-24px;z-index:2;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tab{width:auto;padding:6px 12px;font-size:13px;font-weight:600;background:#2a343d;color:var(--tx);border-radius:999px}
.tab[aria-pressed="true"]{background:var(--acc)}
article+article{margin-top:16px}
#logout{width:auto;padding:6px 12px;font-size:13px;background:#2a343d}
</style>
</head>
<body>
<div class="wrap">
  <form id="lock" autocomplete="off">
    <h1>R4 Reports</h1>
    <p>Only for KVK leadership. Enter the R4 password to read.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" required autofocus>
    <div class="row"><input type="checkbox" id="rem"><label for="rem" style="margin:0">Remember on this device</label></div>
    <button type="submit">Open reports</button>
    <div id="err" role="alert"></div>
  </form>
  <div id="out">
    <div class="top"><a href="../">← Back to the map</a><button id="logout" type="button">Lock</button></div>
    <nav id="tabs" aria-label="Departments"></nav>
    <div id="content"></div>
  </div>
</div>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const e=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.iv)},key,d(P.ct));
  return new TextDecoder().decode(pt);
}
const DEPTS=['All','Summary','Warfare','Diplomacy','Intelligence','Recruitment / HR','Events'];
function show(html){
  const c=document.getElementById('content');c.innerHTML=html;
  // tag every section (h2 + following blocks) with its department
  c.querySelectorAll('article').forEach(a=>{let cur=null;[...a.children].forEach(el=>{if(el.tagName==='H2')cur=el.textContent.trim();if(cur)el.dataset.dept=cur})});
  const nav=document.getElementById('tabs');nav.innerHTML='';
  DEPTS.forEach(d=>{const b=document.createElement('button');b.type='button';b.textContent=d;b.className='tab';b.onclick=()=>pick(d);nav.appendChild(b)});
  let start='All';try{start=localStorage.getItem('kvk.r4tab')||'All'}catch(x){}
  pick(DEPTS.includes(start)?start:'All');
  document.getElementById('lock').style.display='none';document.getElementById('out').style.display='block'}
function pick(d){
  try{localStorage.setItem('kvk.r4tab',d)}catch(x){}
  document.querySelectorAll('#tabs .tab').forEach(b=>b.setAttribute('aria-pressed',b.textContent===d));
  document.querySelectorAll('#content article').forEach(a=>{let any=false;[...a.children].forEach(el=>{
    const keep=d==='All'||el.tagName==='H1'||el.classList.contains('meta')||el.dataset.dept===d;el.style.display=keep?'':'none';if(el.dataset.dept===d)any=true});
    a.style.display=(d==='All'||any)?'':'none'});
  document.querySelectorAll('#content hr').forEach(h=>h.style.display=d==='All'?'':'none')}
document.getElementById('lock').addEventListener('submit',async ev=>{
  ev.preventDefault();const pw=document.getElementById('pw').value;const err=document.getElementById('err');err.textContent='Opening…';
  try{const h=await open(pw);if(document.getElementById('rem').checked){try{localStorage.setItem(K,pw)}catch(x){}}err.textContent='';show(h)}
  catch(x){err.textContent='Wrong password. Try again.'}
});
document.getElementById('logout').addEventListener('click',()=>{try{localStorage.removeItem(K)}catch(x){}location.reload()});
(async()=>{let s=null;try{s=localStorage.getItem(K)}catch(x){}if(s){try{show(await open(s))}catch(x){try{localStorage.removeItem(K)}catch(y){}}}})();
</script>
